name: CI

on:
  push:
    branches: [main]
    paths: &site
      - 'apps/web/**'
      - '.github/workflows/ci.yaml'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'
  pull_request:
    branches: [main]
    paths: *site

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Sanity
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps
        working-directory: ./apps/web
      - name: Build, check, and run unit and end-to-end tests
        run: vp run sanity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: ./apps/web/test-results/
          retention-days: 30
  deploy:
    name: Deploy & test production
    if: github.event_name == 'push'
    needs: sanity
    env:
      PUBLIC_ROOT_URL: https://magrippis.com
    environment:
      name: production
      url: ${{ env.PUBLIC_ROOT_URL }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Deploy to Cloudflare
        run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps
      - name: Run Playwright tests against production
        run: vp run playwright
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-test-results
          path: ./apps/web/test-results/
          retention-days: 30
