name: Quality Assurance for Web App

on:
  push:
    branches: [main]
    paths: ['apps/web/**']
  pull_request:
    branches: [main]
    paths: ['apps/web/**']

jobs:
  sanity-check:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Build the web app
        run: vp build
      - name: Code quality check (format, lint, type check)
        run: vp check
        working-directory: .
      - name: Type check with svelte-check
        run: vp run check
  browser-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Build the web app
        run: vp build
      - name: Install Playwright Browsers
        run: vp exec playwright install --with-deps
      - name: Run Playwright tests
        run: vp run playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./apps/web/test-results/
          retention-days: 30
  vitest-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Run Vitest (unit/integration) tests
        run: vp test
